name: Daily job scrape
on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST every day
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Scrape
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPAPI_MAX: "8"
        run: python scrape.py
      - name: Save jobs.json
        run: |
          git config user.name "jobboard-bot"
          git config user.email "jobboard-bot@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +%F)"
          git push
      - name: Build site
        run: mkdir site && cp board.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
